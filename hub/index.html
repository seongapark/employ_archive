<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23508f">
  <title>고용데이터 아카이브</title>
  <link rel="icon" href="./forecast/icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./core/tokens.css">
  <link rel="stylesheet" href="./core/base.css">
  <link rel="stylesheet" href="./css/hub.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__title">고용데이터 아카이브</div>
    </header>
    <main class="screen">
      <form id="askform" class="askform">
        <input id="askq" class="askform__input" type="text" autocomplete="off"
               placeholder="무엇이든 물어보세요 — 예: 경활과 고용행정통계는 왜 다른가">
        <button class="askform__go" type="submit">묻기</button>
      </form>
      <div id="domains" class="domains"></div>
    </main>
    <div class="notice">본 서비스는 개인이 제작한 비공식 참고자료이며, 각 기관 원문이 정본입니다.</div>
  </div>
  <script type="module" src="./js/hub.js"></script>
</body>
</html>
