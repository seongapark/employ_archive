name: collect-forecast

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 16:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-forecast
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - run: pip install -r requirements.txt
      - run: python -m pytest -q domains/forecast
      - run: python -m domains.forecast.pipeline.collect
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains/forecast/data/
          git diff --cached --quiet || git commit -m "data: daily collect $(date -u +%F)"
          git push
      - name: Fail on collector errors
        env:
          # 원인을 이미 아는 외부 장애. 이 수집기의 실패는 로그로만 남기고 통과시켜,
          # 다른 수집기가 깨진 날을 매일 뜨는 빨간 X 속에 묻지 않는다.
          # 기한은 반드시 붙인다 — 기한이 지나거나 그 수집기가 되살아나면 다시
          # 빨개져서, 이 줄을 지우거나 미루기 전에는 초록으로 돌아가지 않는다.
          # 지금은 비어 있다 — kdi 유예(2026-08-30 의 사이트 전체 502)는
          # kdi 가 되살아난 것을 이 검사가 잡아내 2026-09-02 에 지웠다.
          KNOWN_DOWN: ""
        run: python -m domains.forecast.pipeline.check_run
