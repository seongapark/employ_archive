name: collect-forecast

on:
  # **예약을 끊었다.** KEIS·기재부가 해외 IP 를 막아(2026-09-15 확인: 55개국
  # 접속 시도, 성공 0) GitHub 러너로는 수집이 원리적으로 안 된다. 수집은 이제
  # 국내 PC 의 작업 스케줄러가 collect-local.ps1 로 매일 11:30 에 돌리고,
  # 결과만 push 한다. 이 워크플로는 손으로 부를 때만 돈다 — 차단이 풀렸는지
  # 확인하는 용도다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-forecast
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - run: pip install -r requirements.txt
      - run: python -m pytest -q domains/forecast
      - run: python -m domains.forecast.pipeline.collect
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains/forecast/data/
          git diff --cached --quiet || git commit -m "data: daily collect $(date -u +%F)"
          # 체크아웃한 뒤 수집이 도는 몇 분 사이에 다른 워크플로나 사람이
          # main 에 올렸을 수 있다. 그대로 push 하면 거절돼 그날 수집이
          # 통째로 버려진다 — 2026-08-31 고용동향 실패가 실제로 이것이었다
          # (failed to push some refs). 두 수집 워크플로는 서로 다른 도메인
          # 폴더만 건드리므로 rebase 로 얹으면 섞이지 않는다. 그래도 충돌이
          # 나면 여기서 멈춘다 — 조용히 덮는 것보다 빨간 X 가 낫다.
          # **충돌하면 이번 회차 것을 쓴다(-X theirs).** rebase 에서 "theirs" 는
          # 지금 얹는 커밋, 즉 방금 수집한 쪽이다. 같은 워크플로가 자기
          # last_run.json 을 회차마다 다시 써서, 앞 회차 푸시가 늦게 반영되면
          # 시각 한 줄로 충돌한다 — 2026-09-13 에 GitHub 가 500 으로 거절했다가
          # 실제로는 반영한 푸시 때문에 그렇게 죽었다. 새 회차 것이 맞는 값이고,
          # 커밋에 담기는 경로가 자기 도메인뿐이라 남의 것을 덮지 않는다.
          git pull --rebase -X theirs origin main
          git push
      - name: Fail on collector errors
        env:
          # 원인을 이미 아는 외부 장애. 이 수집기의 실패는 로그로만 남기고 통과시켜,
          # 다른 수집기가 깨진 날을 매일 뜨는 빨간 X 속에 묻지 않는다.
          # 기한은 반드시 붙인다 — 기한이 지나거나 그 수집기가 되살아나면 다시
          # 빨개져서, 이 줄을 지우거나 미루기 전에는 초록으로 돌아가지 않는다.
          # 지금은 비어 있다 — kdi 유예(2026-08-30 의 사이트 전체 502)는
          # kdi 가 되살아난 것을 이 검사가 잡아내 2026-09-02 에 지웠다.
          KNOWN_DOWN: ""
        run: python -m domains.forecast.pipeline.check_run

  sync:
    # 색인은 네 도메인에 걸쳐 있다. 수집이 담은 것을 여기서 바로 싣지 않으면
    # 사람이 다음에 무언가 밀 때까지 검색이 옛 색인으로 답한다.
    needs: collect
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/sync-fts.yml

  deploy:
    # 수집이 커밋한 데이터를 사이트에 올린다. **봇이 민 커밋은 push 트리거를
    # 만들지 않는다** — 기본 토큰으로 한 푸시는 다른 워크플로를 트리거하지
    # 않는 것이 GitHub 규칙이다. 그래서 pages.yml 의 push 트리거가 안 걸리고,
    # 이 호출이 없으면 오늘 수집 결과가 12:20 예약 배포 때까지 화면에 안 나온다
    # (2026-09-13 에 고쳐진 실패를 화면이 계속 실패로 보여줬다).
    #
    # 수집 잡이 빨개도 배포한다 — 마지막 검사가 실패해도 담은 것은 이미
    # 커밋됐고, 그것이 화면에 안 올라오면 사람이 옛 상태를 보고 판단한다.
    # 건너뛴 경우(press 의 아무 날도 아닌 실행)만 배포하지 않는다.
    needs: [collect, sync]
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
