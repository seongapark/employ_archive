name: collect-press

on:
  schedule:
    # 목표: **실제로** 10:00~20:00 KST 사이에 한 시간 간격으로 돈다.
    #
    # 여기 적힌 시각은 그 목표에서 지연을 미리 뺀 값이다. 이 저장소의 예약
    # 실행은 5~8시간 늦게 시작한다(2026-09-02 측정: 표본 8개, 최소 5.3h /
    # 중앙 5.6h / 최대 7.9h). 중앙값 6시간을 빼서 19:00~05:00 UTC 로 적었고,
    # 그래서 실제 실행이 10시~20시 KST 근처에 떨어진다. 이 숫자는 발표
    # 시각이 아니라 **지연 관측값**에 매여 있다 — 지연이 달라지면 다시 재서
    # 옮겨야 한다. push·workflow_dispatch 는 40초 안에 시작하므로 늦는 것은
    # schedule 이벤트뿐이다.
    #
    # 매시간 도는 것은 **배포 당일뿐**이다. 그날은 기사가 12시 엠바고부터 밤까지
    # 계속 올라오고, 이 도메인은 늦게 아는 것이 가장 나쁘다. 이튿날과 후속 구간은
    # 하루 한 번이면 되고, 그 판단은 크론이 아니라 `plan.should_run` 이 한다 —
    # 늦게 깬 실행이 엉뚱한 날로 넘어가도 회차를 안 놓치게 하려면 시각이 아니라
    # 상태로 판단해야 한다.
    #
    # 후속(D+2~D+22)은 **매일** 돈다. 2026-09-11 에 D+16 하루에서 바꿨다 —
    # 한 번만 긁으면 후속 화면이 3주 내내 비어 있다가 갑자기 차서, 그 사이에
    # 프레임이 번져도 아무도 모른다. 매일 다시 긁어도 손해가 없다: 수집은
    # 발행일로 거르므로 같은 구간을 통째로 다시 훑고, 판정은 제목으로 이어져
    # 새 기사만 LLM 에 간다.
    - cron: "0 19-23 * * *"
    - cron: "0 0-5 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "배포일 YYYY-MM-DD (비우면 오늘 할 일을 스스로 정한다)"
        required: false
      kind:
        description: "regular | follow"
        required: false

permissions:
  contents: write

concurrency:
  # 겹치면 두 실행이 같은 파일을 쓰고 서로의 push 를 거절한다.
  group: collect-press
  cancel-in-progress: false

jobs:
  plan:
    # 대부분의 날은 여기서 끝난다. 수집 잡을 통째로 건너뛰게 해서
    # 아무 날도 아닌 실행이 30초 안에 초록으로 끝나게 한다.
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests lxml
      - id: decide
        run: |
          if [ -n "${{ inputs.release }}" ] && [ -n "${{ inputs.kind }}" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
            echo "release=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
            echo "직접 지정: ${{ inputs.release }} ${{ inputs.kind }}"
            exit 0
          fi
          python -m domains.press.pipeline.run_round --dry-run | tee plan.txt
          grep '^PLAN_KIND=' plan.txt | sed 's/PLAN_//' | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"
          grep '^PLAN_RELEASE=' plan.txt | sed 's/PLAN_//' | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    if: needs.plan.outputs.kind != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q domains/press
      - name: Claude Code CLI
        # 판정을 API 크레딧이 아니라 **구독**으로 돌린다(JUDGE_PROVIDER=cli).
        # 토큰은 `claude setup-token` 으로 발급한 1년 만기 OAuth 토큰을
        # CLAUDE_CODE_OAUTH_TOKEN 시크릿에 넣은 것이다(reports 와 같은 토큰).
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Collect and judge
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          # 구독 경로. **이 값이 곧 유일한 판정 경로다** — 비우면 판정이
          # 실패하고(폴백 없음), 그 회차 기사는 화면에서 '인용 아님'으로
          # 세어진다. 미판정 건수가 last_run.json 에 남아 관리자 화면이 말한다.
          JUDGE_PROVIDER: cli
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # **API 키는 넘기지 않는다.** 판정 코드에서 키로 도는 길을 지웠고
          # (2026-09-14), 여기서도 안 넘겨 두 겹으로 막는다 — 코드가 되돌아가도
          # 쓸 키가 없다. 구독이 막히면 판정이 실패하고, 그 사실이 관리자 화면의
          # 도메인 현황에 뜬다. 조용히 다른 지갑으로 새지 않는다.
        run: |
          python -m domains.press.pipeline.run_round \
            --release "${{ needs.plan.outputs.release }}" \
            --kind "${{ needs.plan.outputs.kind }}"
      - name: Commit data
        # 앞 단계가 죽어도 **담은 것은 담는다.** 러너는 사라지므로 여기서 커밋하지
        # 않으면 그날 긁은 원자료가 없어진다(2026-09-12 에 이 구멍을 찾았다).
        if: always()
        run: |
          git config user.name "press-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # sources/releases 는 .gitignore 다(hwpx 는 게시판에서 다시 받는다).
          # raw 와 verdicts 는 **다시 만들 수 없어서** 반드시 담는다 — 네이버
          # 검색은 약 50일이면 그 회차에 못 닿는다.
          git add domains/press/data/ domains/press/sources/
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "data: press collect ${{ needs.plan.outputs.release }} ${{ needs.plan.outputs.kind }} ($(date -u +%F))"
          # 체크아웃한 뒤 수집이 도는 사이에 다른 워크플로가 main 에 올렸을 수
          # 있다. 그대로 push 하면 거절돼 그 회차 수집이 통째로 버려진다.
          # 도메인 폴더가 서로 달라 rebase 로 얹으면 섞이지 않는다.
          # **충돌하면 이번 회차 것을 쓴다(-X theirs).** rebase 에서 "theirs" 는
          # 지금 얹는 커밋, 즉 방금 수집한 쪽이다. 같은 워크플로가 자기
          # last_run.json 을 회차마다 다시 써서, 앞 회차 푸시가 늦게 반영되면
          # 시각 한 줄로 충돌한다 — 2026-09-13 에 GitHub 가 500 으로 거절했다가
          # 실제로는 반영한 푸시 때문에 그렇게 죽었다. 새 회차 것이 맞는 값이고,
          # 커밋에 담기는 경로가 자기 도메인뿐이라 남의 것을 덮지 않는다.
          git pull --rebase -X theirs origin main
          git push

  sync:
    # 색인은 네 도메인에 걸쳐 있다. 수집이 담은 것을 여기서 바로 싣지 않으면
    # 사람이 다음에 무언가 밀 때까지 검색이 옛 색인으로 답한다.
    needs: collect
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/sync-fts.yml

  deploy:
    # 수집이 커밋한 데이터를 사이트에 올린다. **봇이 민 커밋은 push 트리거를
    # 만들지 않는다** — 기본 토큰으로 한 푸시는 다른 워크플로를 트리거하지
    # 않는 것이 GitHub 규칙이다. 그래서 pages.yml 의 push 트리거가 안 걸리고,
    # 이 호출이 없으면 오늘 수집 결과가 12:20 예약 배포 때까지 화면에 안 나온다
    # (2026-09-13 에 고쳐진 실패를 화면이 계속 실패로 보여줬다).
    #
    # 수집 잡이 빨개도 배포한다 — 마지막 검사가 실패해도 담은 것은 이미
    # 커밋됐고, 그것이 화면에 안 올라오면 사람이 옛 상태를 보고 판단한다.
    # 건너뛴 경우(press 의 아무 날도 아닌 실행)만 배포하지 않는다.
    needs: [collect, sync]
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
