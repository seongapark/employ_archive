name: sync-fts

# 출처 탐색 색인(doc_fts)을 다시 싣는다.
#
# **도메인별 수집 워크플로에 붙이지 않고 따로 둔다.** 색인이 네 도메인 데이터에
# 걸쳐 있어서, 각 수집기가 저마다 밀면 같은 표를 하루에 네 번 비웠다 다시 채운다.
# 게다가 적재는 전량 재적재(DELETE 후 INSERT)라 두 실행이 겹치면 그사이 조회가
# 빈손을 본다 — concurrency 로 한 번에 하나만 돌게 막는다.
#
# **수집 워크플로가 끝에서 이 워크플로를 직접 부른다(workflow_call).** 봇이 민
# 커밋은 push 이벤트를 만들지 않으므로(기본 토큰으로 한 푸시는 다른 워크플로를
# 트리거하지 않는 것이 GitHub 규칙이다) 아래 push 트리거는 **사람 푸시에만**
# 걸린다. 2026-09-13 에 실행 이력을 세어 보고 알았다 — 그때까지 매일의 수집
# 결과는 색인에 실리지 않았고, 사람이 무언가 밀 때에야 따라 실렸다.

on:
  push:
    branches: [main]
    paths:
      - 'domains/reports/data/**'
      - 'domains/forecast/data/rationales.json'
      - 'domains/press/data/**'
      - 'domains/ask/data/**'
      # 적재기·푸시기·이 워크플로 자체가 바뀌어도 다시 싣는다. 전에는 적재기 한
      # 파일만 보다가, 푸시기를 바꾼 커밋이 색인을 그대로 두는 일이 있었다.
      - 'tools/fts_load.py'
      - 'tools/d1_push.py'
      - 'tools/fts_verify.py'
      - '.github/workflows/sync-fts.yml'
  workflow_dispatch:
  workflow_call:

# 이 워크플로가 질의응답 현황(domains/ask/data/last_run.json)을 커밋한다.
# 선언이 없으면 저장소 기본값에 따라 읽기 전용이 되어 push 가 403 으로 죽는다.
permissions:
  contents: write

concurrency:
  group: sync-fts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 적재기가 깨졌으면 밀지 않는다 — 빈 색인이 낡은 색인보다 나쁘다.
      # **생성한 SQL 을 sqlite3 로 실제 실행해 보는 검사가 여기 있다**
      # (tools/tests/test_fts_sql_parses.py). 본문에 든 NUL·주석 표시 때문에 원격
      # 적재가 조용히 반만 되던 일을 CI 를 태우기 전에 잡는다.
      - run: python -m pytest -q tools
      - name: FTS 색인 재적재
        id: load
        env:
          PYTHONIOENCODING: utf-8
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # **한 파일로 밀지 않는다.** 2026-09-13 에 5,379행을 한 파일로 밀었더니
          # wrangler 가 `Warning: leftover buffer from sql.ingest` 를 내며 뒤쪽 문장을
          # 조용히 버리고 **종료코드 0** 으로 끝났다 — 색인에 reports 만 남고
          # forecast·press·카탈로그 526행이 사라졌는데 이 워크플로는 초록이었다.
          python -m tools.fts_load --out-dir /tmp/fts
          ls -l /tmp/fts
          # **같은 내용이면 안 민다.** FTS5 는 upsert 를 못 받아 DELETE 후 전량
          # INSERT 다. 내용이 그대로여도 6,100행을 지우고 6,100행을 넣는다 —
          # 2026-09-13 에 이 워크플로가 16번 돌아 하루 쓰기 한도를 넘겼다.
          # 도장은 **아래 건수 확인까지 통과한 뒤에** 찍는다(record 스텝).
          gate="$(python -m tools.d1_gate check fts /tmp/fts/*.sql)"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          # **wrangler 의 파일 적재를 쓰지 않는다.** 조각 크기를 2MB→700KB→400KB 로
          # 줄여 가며 재 봤지만 소실이 202→138→30행으로 줄기만 하고 사라지지 않았다.
          # 문장 경계를 아는 쪽(우리)이 나눠 REST API 로 직접 보낸다.
          if [ "$gate" = push ]; then
            python -m tools.d1_push /tmp/fts/*.sql
          else
            echo "색인 내용이 그대로다 — 적재를 건너뛴다"
          fi
      # 적재가 조용히 반만 되는 실패가 실제로 있었다. **건수를 세서 확인한다** —
      # 네 도메인 중 하나라도 비면 여기서 빨갛게 죽는다.
      - name: 색인 건수 확인
        id: verify
        env:
          PYTHONIOENCODING: utf-8
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute employ-archive-ask --remote --json \
            --config domains/ask/worker/wrangler.jsonc \
            --command "SELECT 도메인, COUNT(*) AS n FROM doc_fts GROUP BY 도메인" \
            | python -m tools.fts_verify /tmp/fts/counts.json

      # **도장은 여기서 찍는다.** 적재가 반만 들어간 채 초록으로 끝난 회차가
      # 실제로 있었다 — 그 상태에 지문을 남기면 다음 회차가 「그대로다」라며
      # 건너뛰어 깨진 색인이 굳는다. 건수 확인까지 통과했을 때만 남긴다.
      - name: 적재 지문 남기기
        if: steps.load.outputs.gate == 'push'
        env:
          PYTHONIOENCODING: utf-8
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.d1_gate record fts /tmp/fts/*.sql

      # 질의응답 카드의 값은 여기서 나온다. 이 기록이 없으면 관리자 화면은
      # 2026-09-08 에 손으로 박아 둔 "카탈로그 정상" 을 영원히 보여준다 —
      # 색인이 깨진 날에도 그렇다. 실패한 회차도 남긴다(그래야 화면이 말한다).
      - name: 질의응답 현황 기록
        if: always()
        run: |
          git config user.name "ask-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # **최신 위에 다시 쓰고 민다.** 기록은 회차마다 시각이 달라지는 생성
          # 파일이라, 커밋해 두고 rebase 하면 남의 기록과 늘 충돌한다(2026-09-13
          # 에 `could not apply chore(ask)...` 로 죽었다). 다시 만드는 것이
          # 합치는 것보다 싸다 — 그래서 받아온 다음에 쓴다.
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            python -m tools.ask_stamp /tmp/fts/counts.json --status ${{ steps.verify.outcome }}
            git add domains/ask/data/last_run.json
            if git diff --cached --quiet; then
              echo "바뀐 것이 없다 — 커밋하지 않는다"
              exit 0
            fi
            git commit -m "chore(ask): 색인 적재 기록 갱신 [skip ci]"
            if git push; then exit 0; fi
            echo "밀리는 사이 남이 올렸다 — 다시 받는다 ($i)"
          done
          echo "세 번 시도했는데 못 밀었다"
          exit 1
