name: check-claude-token

# 구독 판정(JUDGE_PROVIDER=cli)이 쓰는 CLAUDE_CODE_OAUTH_TOKEN 이 살아 있는지
# 1분 안에 확인한다. 시크릿을 갈고 나서 다음 회차까지 기다리지 않으려는 것이다.
#
# 예약으로 돌리지 않는다 — 판정 단계가 이미 시끄럽게 실패하므로 감시가 겹친다.
# 토큰을 갈았을 때, 또는 판정이 401 로 죽어 원인을 가릴 때 손으로 돌린다.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: 토큰 모양 확인
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # 값은 안 찍는다. 길이·앞머리·공백 유무만 본다 — 401 의 흔한 원인이
        # 잘린 붙여넣기, 앞뒤 공백, 그리고 **API 키를 OAuth 자리에 넣은 것**이라
        # 이 셋은 값을 몰라도 가른다. OAuth 토큰은 `sk-ant-oat` 로 시작한다.
        run: |
          python - <<'PY'
          import os
          t = os.environ.get('TOK', '')
          print('길이', len(t))
          print('앞머리', t[:11])
          print('앞뒤 공백 있음', t != t.strip())
          print('줄바꿈 포함', chr(10) in t or chr(13) in t)
          PY

      - name: 토큰 확인
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # 프롬프트는 stdin 으로 준다(판정 경로와 같은 모양). 답이 아니라
        # **인증이 통했는지**가 알고 싶은 것이라 봉투를 그대로 찍는다.
        run: |
          echo '2 더하기 2 는? 숫자만 답하라.' | claude -p --output-format json --model claude-opus-5 > out.json || true
          python - <<'PY'
          import json, sys
          d = json.load(open('out.json', encoding='utf-8'))
          if d.get('is_error'):
              print('토큰 문제:', d.get('api_error_status'), d.get('result'))
              sys.exit(1)
          print('토큰 정상. 답:', d.get('result'))
          PY
