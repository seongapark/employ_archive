name: collect-employment

on:
  schedule:
    # 12:00 KST = 03:00 UTC. 원래 16:00 KST 였는데 앞당겼다 — GitHub 의
    # 예약 실행이 실제로는 5~8시간 늦게 시작하기 때문이다(2026-09-02 측정:
    # 표본 8개, 최소 5.3h / 중앙 5.6h / 최대 7.9h, 세 워크플로가 같은 날
    # 같은 폭으로 밀린다). 분을 옮겨서 해결되는 문제가 아니다 — 정각이
    # 붐벼서가 아니라 이 저장소의 예약 큐 전체가 밀린다. push 로 도는
    # 실행은 40초 안에 시작하므로 늦는 것은 schedule 이벤트뿐이다.
    # 목적은 "퇴근(18:00) 전에 그날 수집 결과를 안다" 이므로 지연을 미리
    # 빼서 적어 둔 것이고, 그래서 이 숫자는 발표 시각이 아니라 지연 관측값에
    # 매여 있다. 지연이 줄면(또는 늘면) 이 값도 다시 재서 옮겨야 한다.
    - cron: "10 3 * * *"  # — 전망 수집(12:00)과 겹치지 않게
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-employment
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q domains/employment
      - run: python -m domains.employment.pipeline.collect
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "employment-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains/employment/data/
          git diff --cached --quiet || git commit -m "data: employment collect $(date -u +%F)"
          # 체크아웃한 뒤 수집이 도는 몇 분 사이에 다른 워크플로나 사람이
          # main 에 올렸을 수 있다. 그대로 push 하면 거절돼 그날 수집이
          # 통째로 버려진다 — 2026-08-31 고용동향 실패가 실제로 이것이었다
          # (failed to push some refs). 두 수집 워크플로는 서로 다른 도메인
          # 폴더만 건드리므로 rebase 로 얹으면 섞이지 않는다. 그래도 충돌이
          # 나면 여기서 멈춘다 — 조용히 덮는 것보다 빨간 X 가 낫다.
          git pull --rebase origin main
          git push
      - name: D1 동기화
        id: d1                           # 아래 요약 스텝이 outcome 을 읽는다
        continue-on-error: true          # D1 이 죽어도 Pages 와 수집은 멀쩡히 돈다
        env:
          PYTHONIOENCODING: utf-8
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m tools.d1_sync employment > /tmp/employment.sql
          npx --yes wrangler@4 d1 execute employ-archive-ask --remote \
            --config domains/ask/worker/wrangler.jsonc --file=/tmp/employment.sql
      # 위 스텝은 continue-on-error 라 실패해도 이 실행은 초록으로 끝난다 — 그래서
      # 동기화가 며칠째 죽어 있어도 실행 목록만 봐서는 알 수 없다. 최소한 실행 페이지
      # 상단 요약에 한 줄은 남긴다(스텝을 하나하나 펼쳐 보지 않아도 되게).
      # 이 스텝 자체는 절대 실패시키지 않는다 — 그러면 continue-on-error 의 뜻이 사라진다.
      - name: D1 동기화 실패를 요약에 남긴다
        if: always()
        run: |
          if [ "${{ steps.d1.outcome }}" = "failure" ]; then
            echo "⚠️ **D1 동기화 실패** — 질의응답(ask) 워커가 보는 고용동향 데이터가 오늘치로 갱신되지 않았다." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "이 스텝은 \`continue-on-error: true\` 라 실행 자체는 초록이다. 원인은 위 \`D1 동기화\` 스텝 로그를 봐라 (자주 나오는 것: 원격 D1 에 \`0001_init.sql\` 이 아직 적용되지 않아 \`no such table\`, 또는 \`CLOUDFLARE_API_TOKEN\`/\`CLOUDFLARE_ACCOUNT_ID\` 시크릿 누락). 자세한 절차는 \`domains/ask/DEPLOY.md\`." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail on collector errors
        env:
          # 원인을 이미 아는 외부 장애. 이 수집기의 실패는 로그로만 남기고 통과시켜,
          # 다른 수집기가 깨진 날을 매일 뜨는 빨간 X 속에 묻지 않는다.
          # 기한은 반드시 붙인다 — 기한이 지나거나 그 수집기가 되살아나면 다시
          # 빨개져서, 이 줄을 지우거나 미루기 전에는 초록으로 돌아가지 않는다.
          # 형식: 콤마로 구분한 "name@YYYY-MM-DD" 목록, 예) kdi@2026-09-30
          KNOWN_DOWN: ""
        run: python -m domains.employment.pipeline.check_run

  deploy:
    # 수집이 커밋한 데이터를 사이트에 올린다. **봇이 민 커밋은 push 트리거를
    # 만들지 않는다** — 기본 토큰으로 한 푸시는 다른 워크플로를 트리거하지
    # 않는 것이 GitHub 규칙이다. 그래서 pages.yml 의 push 트리거가 안 걸리고,
    # 이 호출이 없으면 오늘 수집 결과가 12:20 예약 배포 때까지 화면에 안 나온다
    # (2026-09-13 에 고쳐진 실패를 화면이 계속 실패로 보여줬다).
    #
    # 수집 잡이 빨개도 배포한다 — 마지막 검사가 실패해도 담은 것은 이미
    # 커밋됐고, 그것이 화면에 안 올라오면 사람이 옛 상태를 보고 판단한다.
    # 건너뛴 경우(press 의 아무 날도 아닌 실행)만 배포하지 않는다.
    needs: collect
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
