name: collect-reports

on:
  schedule:
    # 11:30 KST = 02:30 UTC. 기존 셋(전망 12:00 · 고용동향 12:10 · 재배포
    # 12:20)보다 앞에 둔다 — 게시판이 25개고 요청 사이에 지연을 두므로 이
    # 도메인이 가장 오래 돈다.
    #
    # 이 숫자는 발표 시각이 아니라 **GitHub 예약이 5~8시간 늦게 시작한다는
    # 관측값**에서 나왔다(2026-09-02 측정: 표본 8개, 최소 5.3h / 중앙 5.6h /
    # 최대 7.9h). 분을 옮겨서 될 문제가 아니다 — 이 저장소의 예약 큐 전체가
    # 밀린다. push·workflow_dispatch 는 40초 안에 시작한다. 지연 폭이 달라지면
    # 다시 재서 옮긴다. 자세한 근거는 collect-forecast.yml 주석에 있다.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-reports
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q domains/reports
      - name: 수집
        env:
          PYTHONIOENCODING: utf-8
        run: python -m domains.reports.pipeline.collect
      - name: 초록 채우기
        env:
          PYTHONIOENCODING: utf-8
        # 수집이 새로 들고 온 레코드의 원문 PDF 에서 요약 섹션을 뜯는다. 한 번
        # 시도한 것은 다시 받지 않으므로(abstract_tried) 평소에는 몇 건뿐이다.
        # 실패해도 그날 수집을 버리지 않는다 — 초록은 있으면 좋은 것이고,
        # 서지는 이미 위에서 받아 뒀다.
        continue-on-error: true
        run: python -m domains.reports.pipeline.enrich
      - name: 빌드
        env:
          PYTHONIOENCODING: utf-8
        run: python -m domains.reports.pipeline.build
      - name: Claude Code CLI
        # 판정을 API 크레딧이 아니라 **구독**으로 돌린다(JUDGE_PROVIDER=cli).
        # 토큰은 `claude setup-token` 으로 발급한 1년 만기 OAuth 토큰을
        # CLAUDE_CODE_OAUTH_TOKEN 시크릿에 넣은 것이다. 만기가 지나면 판정이
        # 실패하고 check_run 이 회차를 빨갛게 만든다 — 조용히 멈추지 않는다.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: 추천 판정
        env:
          PYTHONIOENCODING: utf-8
          # 구독 경로. **이 값이 곧 유일한 판정 경로다** — 비우면 판정이
          # 실패하고(폴백 없음), 미판정 건수가 last_run.json 에 남아
          # 관리자 화면이 그것을 말한다.
          JUDGE_PROVIDER: cli
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # **API 키는 넘기지 않는다.** 판정 코드에서 키로 도는 길을 지웠고
          # (2026-09-14), 여기서도 안 넘겨 두 겹으로 막는다 — 코드가 되돌아가도
          # 쓸 키가 없다. 구독이 막히면 판정이 실패하고, 그 사실이 관리자 화면의
          # 도메인 현황에 뜬다. 조용히 다른 지갑으로 새지 않는다.
        # 새로 들어온 것만 판정한다(id 캐시). 실패해도 그날 수집을 버리지
        # 않는다 — 아카이브 본체는 키 없이도 돌고, 추천은 다음 회차에 붙는다.
        continue-on-error: true
        run: python -m domains.reports.pipeline.recommend
      - name: Commit data
        run: |
          git config user.name "reports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains/reports/data/ domains/reports/sources/
          git diff --cached --quiet || git commit -m "data: reports collect $(date -u +%F)"
          # 체크아웃한 뒤 수집이 도는 사이에 다른 워크플로가 main 에 올렸을 수
          # 있다. 그대로 push 하면 거절돼 그날 수집이 통째로 버려진다
          # (2026-08-31 고용동향이 실제로 그랬다). 도메인 폴더가 서로 다르므로
          # rebase 로 얹으면 섞이지 않는다. 그래도 충돌이 나면 여기서 멈춘다 —
          # 조용히 덮는 것보다 빨간 X 가 낫다.
          # **충돌하면 이번 회차 것을 쓴다(-X theirs).** rebase 에서 "theirs" 는
          # 지금 얹는 커밋, 즉 방금 수집한 쪽이다. 같은 워크플로가 자기
          # last_run.json 을 회차마다 다시 써서, 앞 회차 푸시가 늦게 반영되면
          # 시각 한 줄로 충돌한다 — 2026-09-13 에 GitHub 가 500 으로 거절했다가
          # 실제로는 반영한 푸시 때문에 그렇게 죽었다. 새 회차 것이 맞는 값이고,
          # 커밋에 담기는 경로가 자기 도메인뿐이라 남의 것을 덮지 않는다.
          git pull --rebase -X theirs origin main
          git push
      - name: 회차 판정
        env:
          PYTHONIOENCODING: utf-8
          # 외부 장애는 `보드id@YYYY-MM-DD` 로 적어 둔다. 알람이지 스위치가
          # 아니다 — 기한이 지나거나 그 게시판이 되살아나면 일부러 실패한다.
          KNOWN_DOWN: ""
        run: python -m domains.reports.pipeline.check_run

  sync:
    # 색인은 네 도메인에 걸쳐 있다. 수집이 담은 것을 여기서 바로 싣지 않으면
    # 사람이 다음에 무언가 밀 때까지 검색이 옛 색인으로 답한다.
    needs: collect
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/sync-fts.yml

  deploy:
    # 수집이 커밋한 데이터를 사이트에 올린다. **봇이 민 커밋은 push 트리거를
    # 만들지 않는다** — 기본 토큰으로 한 푸시는 다른 워크플로를 트리거하지
    # 않는 것이 GitHub 규칙이다. 그래서 pages.yml 의 push 트리거가 안 걸리고,
    # 이 호출이 없으면 오늘 수집 결과가 12:20 예약 배포 때까지 화면에 안 나온다
    # (2026-09-13 에 고쳐진 실패를 화면이 계속 실패로 보여줬다).
    #
    # 수집 잡이 빨개도 배포한다 — 마지막 검사가 실패해도 담은 것은 이미
    # 커밋됐고, 그것이 화면에 안 올라오면 사람이 옛 상태를 보고 판단한다.
    # 건너뛴 경우(press 의 아무 날도 아닌 실행)만 배포하지 않는다.
    needs: [collect, sync]
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
