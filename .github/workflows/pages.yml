name: pages

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "core/**"
      - "domains/**"
      - "tools/build.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 12:20 KST — 일일 수집(12:00) 20분 후. 수집 시각을 앞당긴 이유는
    # collect-forecast.yml 의 schedule 주석에 있다. 이 예약은 보조일
    # 뿐이다 — domains/** 가 바뀌면 push 로 이미 재배포된다.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web tests
        run: >-
          node --test "core/tests/*.mjs" "hub/tests/*.mjs"
          "domains/forecast/tests/web/*.mjs" "domains/employment/tests/web/*.mjs"
      - name: Build site
        run: python -m tools.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
