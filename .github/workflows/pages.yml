name: pages

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "core/**"
      - "domains/**"
      - "tools/build.py"
      - ".github/workflows/pages.yml"
  schedule:
    # 12:20 KST — 일일 수집(12:00) 20분 후. 수집 시각을 앞당긴 이유는
    # collect-forecast.yml 의 schedule 주석에 있다. 이 예약은 그물이다 —
    # 수집 워크플로가 끝에서 이 워크플로를 직접 부르므로(workflow_call) 보통은
    # 그때 이미 배포돼 있다. **push 트리거는 사람 푸시에만 걸린다** — 봇이 민
    # 데이터 커밋은 push 이벤트를 만들지 않는다(GitHub 규칙).
    - cron: "20 3 * * *"
  workflow_dispatch:
  # 수집 워크플로가 데이터를 커밋한 뒤 이 워크플로를 **불러서** 배포한다.
  # 봇이 민 커밋은 push 이벤트를 만들지 않으므로(GitHub 규칙: 기본 토큰으로
  # 한 푸시는 다른 워크플로를 트리거하지 않는다) 위의 push 트리거가 안 걸린다.
  # 2026-09-13 에 그걸 모르고 "고쳤는데 화면이 그대로"를 한참 쫓았다.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # **main 의 끝을 올린다. 이 실행을 띄운 SHA 가 아니라.**
      #
      # ref 를 안 주면 checkout 은 github.sha — 이 실행이 시작된 시점의 커밋 —
      # 을 잡는다. 그런데 수집 워크플로가 이 배포를 workflow_call 로 부를 때,
      # 올려야 할 데이터 커밋은 **그 실행 도중에** 생긴다. 그래서 수집기는
      # 자기가 방금 만든 데이터를 자기 배포 잡으로는 결코 못 올렸고, 다음
      # 누군가의 배포가 따라 올려 줄 때까지 화면이 옛 숫자를 보여줬다.
      #
      # 2026-09-14 에 네 도메인을 연달아 돌려 보고 알았다: 마지막 배포가 기준
      # 삼은 SHA 이후에 커밋된 forecast·reports 의 갱신시각이 화면에서 전날로
      # 남았다(employment·press 는 그 SHA 안에 들어와 멀쩡했다). 평소에도
      # 매일 이랬다 — 마지막에 도는 수집기만 제때 올라갔다.
      #
      # 사람 push 로 걸릴 때는 그 push 가 곧 main 끝이라 동작이 같다. 수집이
      # 겹쳐 남의 커밋까지 같이 올라가는 것은 문제가 아니라 맞는 동작이다 —
      # 배포는 그 순간의 정본 전체여야 한다.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tools domains/ask
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Web tests
        run: >-
          node --test "core/tests/*.mjs" "hub/tests/*.mjs"
          "domains/forecast/tests/web/*.mjs" "domains/employment/tests/web/*.mjs"
          "domains/ask/tests/web/*.test.mjs" "domains/reports/tests/web/*.test.mjs"
          "domains/press/tests/web/*.test.mjs" "domains/admin/tests/web/*.test.mjs"
      - name: Build site
        run: python -m tools.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
