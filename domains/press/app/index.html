<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23508f">
  <title>행통 모니터링</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./core/tokens.css">
  <link rel="stylesheet" href="./core/base.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="header__home" href="../" aria-label="홈으로">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      </a>
      <div class="header__title" id="headerTitle">행통 모니터링</div>
      <div class="header__meta"><span class="num" id="headerDate"></span></div>
    </header>
    <div id="offlineBanner" class="offline-banner" hidden>오프라인 · 마지막으로 받은 데이터를 표시 중</div>
    <div class="switcher" id="roundSwitch"></div>
    <main id="screen" class="screen"></main>
    <div class="notice">본 서비스는 개인이 제작한 비공식 참고자료이며, 각 기관 원문이 정본입니다.</div>
    <nav class="tabbar" id="tabbar">
      <a class="tab" href="#/" data-route="home">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
        <span>홈</span>
      </a>
      <a class="tab" href="#/articles" data-route="articles">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9h6M7 13h10M7 17h10"></path></svg>
        <span>기사</span>
      </a>
      <a class="tab" href="#/follow" data-route="follow">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 4-6 5 4"></path><circle cx="8" cy="11" r="1.4"></circle><circle cx="16" cy="8" r="1.4"></circle></svg>
        <span>후속</span>
      </a>
      <a class="tab" href="#/rounds" data-route="rounds">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
        <span>회차</span>
      </a>
    </nav>
  </div>
  <script type="module" src="./js/app.js"></script>

</html>
