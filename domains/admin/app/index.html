<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23508f">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 · 고용데이터 아카이브</title>
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="./core/tokens.css">
  <link rel="stylesheet" href="./core/base.css">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="header__home" href="../" aria-label="허브로">←</a>
      <div class="header__title">관리자</div>
    </header>
    <!-- 성격이 다른 두 화면이라 탭으로 가른다. 한 두루마리로 이어 붙이면
         "수집이 잘 도나"(도메인 현황)와 "사람이 오나"(방문 현황)가 눈에
         구분되지 않는다. 탭바는 `.screen` 밖에 둔다 — 안에 두면 내용과 함께
         스크롤돼 아래로 내려간 사람이 탭을 못 찾는다(허브·도메인 앱과 같은 규칙).
         비밀번호를 넣기 전에는 보여 줄 것이 없으므로 숨겨 둔다. -->
    <nav class="segments" id="tabs" role="tablist" hidden>
      <button class="segment segment--active" data-tab="현황" type="button" role="tab">도메인 현황</button>
      <button class="segment" data-tab="방문" type="button" role="tab">방문 현황</button>
    </nav>
    <main id="screen" class="screen"></main>
  </div>
  <script type="module" src="./js/admin.js"></script>
  <script>
    // 이 워커는 오프라인이 아니라 **신선도**를 위한 것이다 — 배포 직후 옛 JS 가
    // 캐시에서 나와 화면이 안 바뀐 것처럼 보이는 일을 막는다(sw.js 주석 참고).
    // manifest 는 여전히 없다: 이 화면은 설치 대상이 아니다.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
